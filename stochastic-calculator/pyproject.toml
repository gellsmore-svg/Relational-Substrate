[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rs-stochastic-calculator"
version = "0.1.0"
description = "Constrained stochastic relational arithmetic research apparatus"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
research = ["matplotlib>=3.7"]

[project.scripts]
rs-calc = "rs_calc.cli:main"

[tool.setuptools.packages.find]
include = ["rs_calc*"]
