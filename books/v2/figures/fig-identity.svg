<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" font-family="DejaVu Serif, Georgia, serif">
  <title>Same appearance, different identity</title>
  <defs><marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/></marker></defs>
  <rect width="1100" height="640" fill="#ffffff"/>
  <text x="40" y="50" font-size="28" fill="#2b2b2b" font-weight="bold">Same appearance, different identity</text>
  <g>
    <rect x="60" y="90" width="300" height="190" rx="16" fill="#f3efe4" stroke="#8a6d2f" stroke-width="3"/>
    <text x="210" y="125" font-size="22" text-anchor="middle" fill="#5a4416" font-weight="bold">State A</text>
    <g fill="#2c4a6e"><circle cx="140" cy="180" r="14"/><circle cx="210" cy="180" r="14"/><circle cx="280" cy="180" r="14"/></g>
    <circle cx="210" cy="235" r="11" fill="#b08a3e"/><text x="232" y="241" font-size="16" fill="#5a4416">hidden detail</text>
    <rect x="60" y="330" width="300" height="190" rx="16" fill="#f3efe4" stroke="#8a6d2f" stroke-width="3"/>
    <text x="210" y="365" font-size="22" text-anchor="middle" fill="#5a4416" font-weight="bold">State B</text>
    <g fill="#2c4a6e"><circle cx="140" cy="420" r="14"/><circle cx="210" cy="420" r="14"/><circle cx="280" cy="420" r="14"/></g>
    <circle cx="210" cy="475" r="11" fill="#9aa6b2"/><text x="232" y="481" font-size="16" fill="#3a3a3a">hidden detail</text>
  </g>
  <rect x="440" y="230" width="240" height="150" rx="16" fill="#e6edf4" stroke="#2c4a6e" stroke-width="3"/>
  <text x="560" y="268" font-size="20" text-anchor="middle" fill="#1f3654" font-weight="bold">One description</text>
  <g fill="#2c4a6e"><circle cx="500" cy="320" r="14"/><circle cx="560" cy="320" r="14"/><circle cx="620" cy="320" r="14"/></g>
  <text x="560" y="365" font-size="16" text-anchor="middle" fill="#3a3a3a">"they look the same"</text>
  <g stroke="#2c4a6e" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#m)"><line x1="362" y1="190" x2="436" y2="270"/><line x1="362" y1="420" x2="436" y2="340"/></g>
  <text x="400" y="220" font-size="15" fill="#1f3654" font-style="italic" text-anchor="middle">projection</text>
  <rect x="790" y="90" width="270" height="130" rx="16" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.5"/>
  <text x="925" y="135" font-size="20" text-anchor="middle" fill="#2b2b2b" font-weight="bold">Outcome 1</text>
  <text x="925" y="170" font-size="16" text-anchor="middle" fill="#3a3a3a">the key turns</text>
  <rect x="790" y="390" width="270" height="130" rx="16" fill="#ffffff" stroke="#2b2b2b" stroke-width="2.5"/>
  <text x="925" y="435" font-size="20" text-anchor="middle" fill="#2b2b2b" font-weight="bold">Outcome 2</text>
  <text x="925" y="470" font-size="16" text-anchor="middle" fill="#3a3a3a">the key does not</text>
  <g stroke="#b08a3e" stroke-width="3.5" marker-end="url(#m)"><path d="M362,150 C560,60 640,90 786,150" fill="none"/><path d="M362,470 C560,580 640,540 786,460" fill="none"/></g>
  <text x="575" y="88" font-size="16" text-anchor="middle" fill="#5a4416" font-style="italic">a reachable future interaction</text>
  <text x="575" y="590" font-size="16" text-anchor="middle" fill="#5a4416" font-style="italic">draws on the hidden detail</text>
  <text x="550" y="625" font-size="17" text-anchor="middle" fill="#7a2f2f" font-style="italic">If nothing reachable could draw on the detail, treating A and B as one would lose nothing.</text>
</svg>
