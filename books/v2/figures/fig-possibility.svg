<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="640" viewBox="0 0 1000 640" font-family="DejaVu Serif, Georgia, serif">
  <title>Constrained possibility and actualisation</title>
  <rect width="1000" height="640" fill="#ffffff"/>
  <text x="40" y="52" font-size="28" fill="#2b2b2b" font-weight="bold">What can be (T0) and what comes to be (T1)</text>
  <g stroke="#9aa6b2" stroke-width="3">
    <line x1="120" y1="160" x2="300" y2="160"/><line x1="300" y1="160" x2="480" y2="160"/><line x1="480" y1="160" x2="660" y2="160"/>
    <line x1="120" y1="320" x2="300" y2="320"/><line x1="480" y1="320" x2="660" y2="320"/><line x1="660" y1="320" x2="840" y2="320"/>
    <line x1="120" y1="480" x2="300" y2="480"/><line x1="300" y1="480" x2="480" y2="480"/>
    <line x1="120" y1="160" x2="120" y2="320"/><line x1="300" y1="160" x2="300" y2="320"/><line x1="660" y1="160" x2="660" y2="320"/>
    <line x1="120" y1="320" x2="120" y2="480"/><line x1="480" y1="320" x2="480" y2="480"/><line x1="840" y1="320" x2="840" y2="480"/>
    <line x1="660" y1="480" x2="840" y2="480"/>
  </g>
  <g stroke="#9a3b3b" stroke-width="3" stroke-dasharray="10 8">
    <line x1="300" y1="320" x2="480" y2="320"/><line x1="480" y1="160" x2="480" y2="320"/><line x1="480" y1="480" x2="660" y2="480"/>
  </g>
  <g stroke="#9a3b3b" stroke-width="4"><line x1="378" y1="308" x2="402" y2="332"/><line x1="402" y1="308" x2="378" y2="332"/>
    <line x1="468" y1="228" x2="492" y2="252"/><line x1="492" y1="228" x2="468" y2="252"/>
    <line x1="558" y1="468" x2="582" y2="492"/><line x1="582" y1="468" x2="558" y2="492"/></g>
  <g stroke="#2c4a6e" stroke-width="9" opacity="0.35"><line x1="660" y1="320" x2="840" y2="320"/><line x1="120" y1="480" x2="300" y2="480"/></g>
  <polyline points="120,160 300,160 300,320 120,320 120,480 300,480 480,480 480,320 660,320 840,320 840,480" fill="none" stroke="#b08a3e" stroke-width="6" stroke-linejoin="round"/>
  <g fill="#ffffff" stroke="#2b2b2b" stroke-width="3">
    <circle cx="120" cy="160" r="15"/><circle cx="300" cy="160" r="15"/><circle cx="480" cy="160" r="15"/><circle cx="660" cy="160" r="15"/>
    <circle cx="120" cy="320" r="15"/><circle cx="300" cy="320" r="15"/><circle cx="480" cy="320" r="15"/><circle cx="660" cy="320" r="15"/><circle cx="840" cy="320" r="15"/>
    <circle cx="120" cy="480" r="15"/><circle cx="300" cy="480" r="15"/><circle cx="480" cy="480" r="15"/><circle cx="660" cy="480" r="15"/><circle cx="840" cy="480" r="15"/>
  </g>
  <circle cx="120" cy="160" r="15" fill="#b08a3e"/><circle cx="840" cy="480" r="15" fill="#b08a3e"/>
  <g font-size="20" fill="#2b2b2b">
    <line x1="60" y1="565" x2="110" y2="565" stroke="#9aa6b2" stroke-width="3"/><text x="122" y="572">admissible transition</text>
    <line x1="380" y1="565" x2="430" y2="565" stroke="#9a3b3b" stroke-width="3" stroke-dasharray="10 8"/><text x="442" y="572">forbidden (admissibility)</text>
    <line x1="720" y1="565" x2="770" y2="565" stroke="#2c4a6e" stroke-width="9" opacity="0.35"/><text x="782" y="572">favoured (tendency)</text>
    <line x1="60" y1="605" x2="110" y2="605" stroke="#b08a3e" stroke-width="6"/><text x="122" y="612">one actual history, reached by constrained chance (T1)</text>
  </g>
</svg>
